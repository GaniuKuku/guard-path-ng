version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: guardpath-postgres

    environment:
      POSTGRES_USER: guardpath
      POSTGRES_PASSWORD: guardpath
      POSTGRES_DB: guardpath_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: guardpath-api

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://guardpath:guardpath@postgres:5432/guardpath_db
      JWT_SECRET_KEY: super_secret_guardpath_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
